[project]
name = "meep"
version = "0.1.0"
description = "Tweet organizer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Gökmen Görgen", email = "gkmngrgn@gmail.com" },
]
dependencies = [
    "click>=8.1.3",
    "appdirs>=1.4.4",
    "python-dateutil>=2.8.2",
    "pydantic>=2.10.3",
]

[dependency-groups]
dev = [
    "pylint>=2.15.5",
]

[project.scripts]
meep = "meep.cli:run"

[tool.uv]
package = true

[tool.setuptools]
packages = ["meep"]
